jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.23'

      # ↓↓↓ Updated NDK installation step ↓↓↓
      - name: Install Android NDK r21e
        run: |
          # Ensure we unpack under $HOME where we have write permission
          mkdir -p "$HOME/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip -d "$HOME/ndk"

      - name: Configure ANDROID_NDK_HOME
        run: |
          echo "ANDROID_NDK_HOME=$HOME/ndk/android-ndk-r21e" >> $GITHUB_ENV
          echo "PATH=$ANDROID_NDK_HOME:$PATH" >> $GITHUB_ENV

      # ... the rest of your build steps ...
