name: Build tun2socks AAR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    # --- CHANGE RUNNER AGAIN ---
    runs-on: ubuntu-20.04 # Try ubuntu-20.04

    env:
      ANDROID_API: 21
      NDK_VERSION_RAW: '25.2.9519653' # Corresponds to r25c
      BUILD_TOOLS_VERSION: '33.0.2'
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'

    - name: Add Go bin to PATH
      run: echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest

    # --- Use setup-sdk@v3 (as it's the one now failing) ---
    - name: Setup Android SDK
      uses: android-actions/setup-sdk@v3 # This is the one failing
      id: setup-sdk
      with:
        api-level: ${{ env.ANDROID_API }}
        build-tools: ${{ env.BUILD_TOOLS_VERSION }}
        cmdline-tools-version: latest

    # --- Re-integrate NDK setup using the working action or manual ---
    # If setup-ndk@c71af7a8fcc31d727d1052901b466a786b91862e also failed, stick with manual NDK install approach
    - name: Install Android NDK manually # Manual NDK install from previous attempt
      run: |
        echo "Adding SDK tools to PATH"
        echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH
        echo "Attempting to install NDK version ${{ env.NDK_VERSION_RAW }}"
        yes | sdkmanager "ndk;${{ env.NDK_VERSION_RAW }}"
        echo "NDK installation finished."

    - name: Set NDK_PATH environment variable
      run: |
        NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION_RAW }}"
        echo "NDK_PATH=${NDK_PATH}" >> $GITHUB_ENV
        echo "Found NDK path: ${NDK_PATH}"
        ls -ld "${NDK_PATH}"

    - name: Initialize gomobile
      run: |
         echo "Initializing gomobile with NDK at $NDK_PATH"
         gomobile init -ndk="${NDK_PATH}"

    - name: Build AAR with gomobile bind
      run: |
        mkdir -p build
        echo "--- Running gomobile bind ---"
        export NDK_HOME=$NDK_PATH # Also set NDK_HOME just in case
        gomobile bind \
          -v \
          -target=android \
          -androidapi ${{ env.ANDROID_API }} \
          -o build/tun2socks.aar \
          github.com/eycorsican/go-tun2socks-mobile
        echo "--- gomobile bind finished ---"

    - name: List build directory contents
      run: ls -l build/

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: tun2socks-android-aar
        path: build/tun2socks.aar
