name: Build tun2socks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # استخدام بيئة Ubuntu على GitHub Actions

    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # سحب الكود من المستودع

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.18'  # تأكد من أنك تستخدم إصدار Go الذي تحتاجه

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make  # تثبيت make على بيئة Ubuntu
          go install golang.org/x/mobile/cmd/gomobile@latest  # تثبيت gomobile

      - name: Build tun2socks
        run: |
          cd go-tun2socks-build
          make  # تشغيل make للبناء
