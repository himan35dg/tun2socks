# .github/workflows/build-android.yml
name: Build tun2socks AAR

on:
  push:
    tags:
      - 'v*'       # شغل على كل تاج يبدأ بـ v
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      # الحد الأدنى لإصدار Android API الذي يدعمه tun2socks
      ANDROID_API: 21

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.23.x'

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Setup Android NDK
      uses: android-actions/setup-ndk@v2
      with:
        ndk-version: '21.3.6528147'   # إصدار مدعوم ضمن 21..35

    - name: Install Android SDK tools
      uses: android-actions/setup-sdk@v2
      with:
        api-level: ${{ env.ANDROID_API }}
        components: platform-tools, build-tools;33.0.2

    - name: Build AAR with gomobile bind
      working-directory: go-tun2socks-mobile
      run: |
        mkdir -p build
        gomobile bind \
          -target=android \
          -o build/tun2socks.aar \
          github.com/eycorsican/go-tun2socks-mobile

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v2
      with:
        name: tun2socks-android-aar
        path: go-tun2socks-mobile/build/tun2socks.aar
