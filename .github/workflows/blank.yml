name: Build tun2socks AAR

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v
  workflow_dispatch: # Allow manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_API: 21
      NDK_VERSION: 'r25c' # Example: NDK r25c
      BUILD_TOOLS_VERSION: '33.0.2'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x' # Using 1.22 for stability

    - name: Add Go bin to PATH
      run: echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest

    # --- Use the correct version for setup-ndk ---
    - name: Setup Android NDK
      uses: android-actions/setup-ndk@v1 # <-- CORRECTED VERSION TAG
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}

    # --- setup-sdk does have v3 ---
    - name: Setup Android SDK
      uses: android-actions/setup-sdk@v3
      id: setup-sdk
      with:
        api-level: ${{ env.ANDROID_API }}
        ndk-version: ${{ env.NDK_VERSION }}
        build-tools: ${{ env.BUILD_TOOLS_VERSION }}

    # Initialize gomobile *after* NDK/SDK setup
    - name: Initialize gomobile
      run: |
         # Explicitly tell gomobile where NDK is using the output from the setup-ndk step
         gomobile init -ndk="${{ steps.setup-ndk.outputs.ndk-path }}"

    - name: Build AAR with gomobile bind
      run: |
        mkdir -p build
        echo "--- Running gomobile bind ---"
        gomobile bind \
          -v \
          -target=android \
          -androidapi ${{ env.ANDROID_API }} \
          -o build/tun2socks.aar \
          github.com/eycorsican/go-tun2socks-mobile
        echo "--- gomobile bind finished ---"

    - name: List build directory contents
      run: ls -l build/

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: tun2socks-android-aar
        path: build/tun2socks.aar
