name: Build tun2socks AAR

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v
  workflow_dispatch: # Allow manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      # Minimum Android API level supported by tun2socks
      ANDROID_API: 21
      # Define a recent NDK version
      NDK_VERSION: 'r25c' # Example: NDK r25c (check gomobile docs for recommended versions if needed)
      # Define Android build tools version
      BUILD_TOOLS_VERSION: '33.0.2' # Or choose a different version

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Use latest major version

    - name: Setup Go
      uses: actions/setup-go@v5 # Use latest major version
      with:
        go-version: '1.22.x' # Using 1.22 for better stability, 1.23 might be too new for gomobile sometimes

    - name: Add Go bin to PATH
      run: echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Install and Initialize gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        # gomobile init downloads necessary Go dependencies (like bind) and platform SDKs
        # Run this *before* setting up NDK/SDK via actions if it causes conflicts,
        # or after if it needs them (common case is after)
        # Let's try running init *after* NDK/SDK setup below.

    - name: Setup Android NDK
      uses: android-actions/setup-ndk@v3 # Use latest major version
      id: setup-ndk # Give it an ID to reference outputs if needed
      with:
        ndk-version: ${{ env.NDK_VERSION }}

    - name: Setup Android SDK
      uses: android-actions/setup-sdk@v3 # Use latest major version
      id: setup-sdk # Give it an ID to reference outputs if needed
      with:
        api-level: ${{ env.ANDROID_API }}
        ndk-version: ${{ env.NDK_VERSION }} # Pass NDK version here too
        build-tools: ${{ env.BUILD_TOOLS_VERSION }}
        # components: platform-tools # setup-sdk usually includes this by default

    # Now run gomobile init *after* NDK/SDK are likely set up by the actions
    # It might use these paths during initialization
    - name: Initialize gomobile (after NDK/SDK setup)
      run: |
         gomobile init -ndk="${{ steps.setup-ndk.outputs.ndk-path }}" # Explicitly tell gomobile where NDK is

    - name: Build AAR with gomobile bind
      run: |
        # Create the build directory in the workspace root
        mkdir -p build
        echo "--- Running gomobile bind ---"
        # Use -v for verbose output to help debug if it fails again
        gomobile bind \
          -v \
          -target=android \
          -androidapi ${{ env.ANDROID_API }} \
          -o build/tun2socks.aar \
          github.com/eycorsican/go-tun2socks-mobile
        echo "--- gomobile bind finished ---"

    - name: List build directory contents
      run: ls -l build/

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4 # Use latest major version
      with:
        name: tun2socks-android-aar
        # Path is relative to the workspace root
        path: build/tun2socks.aar
