name: Build tun2socks for Android

on:
  push:
    branches:
      - main  # أو الفرع الذي تستخدمه

jobs:
  build:
    runs-on: ubuntu-latest  # استخدام Ubuntu لبناء المشروع

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.21'  # أو أي إصدار تفضله

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libssl-dev

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build tun2socks for Android
        run: |
          git clone https://github.com/iseki0/go-tun2socks-mobile.git
          cd go-tun2socks-mobile
          make android

      - name: Upload AAR as artifact
        uses: actions/upload-artifact@v2
        with:
          name: tun2socks-android
          path: pkg/android/go-tun2socks-mobile.aar
